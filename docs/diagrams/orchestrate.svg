<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-label="orchestrate: idea to committed code with two approval gates">
<title>orchestrate: idea to committed code with two approval gates</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:14px;font-weight:600}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:13px;font-weight:600}
.s{font-size:12px;fill:#59636e}
.l{font-size:12px;font-weight:600;fill:#59636e}
.file{fill:#dafbe1;stroke:#1a7f37}
.skill{fill:#ddf4ff;stroke:#0969da}
.you{fill:#fff8c5;stroke:#9a6700}
.stop{fill:#ffebe9;stroke:#cf222e}
.step{fill:#f6f8fa;stroke:#59636e}
.e{stroke:#59636e;stroke-width:1.5;fill:none}
.d{stroke-dasharray:5 4}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="639" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="80" y="20" width="300" height="70" rx="8" class="file" stroke-width="1.5"/>
<text x="230.0" y="44.0" text-anchor="middle" class="t">Input</text>
<text x="230.0" y="62.0" text-anchor="middle" class="s">idea, draft, backlog item,</text>
<text x="230.0" y="78.0" text-anchor="middle" class="s">or /grilling summary</text>
<path d="M230,90 L230,124" class="e" marker-end="url(#a)"/>
<rect x="80" y="126" width="300" height="60" rx="8" class="skill" stroke-width="1.5"/>
<text x="230.0" y="153.0" text-anchor="middle" class="t">0. Size the change</text>
<text x="230.0" y="171.0" text-anchor="middle" class="s">files touched, new contracts, open decisions</text>
<path d="M230,186 L230,204" class="e" marker-end="url(#a)"/>
<polygon points="160,246 230,206 300,246 230,286" class="step" stroke-width="1.5"/>
<text x="230" y="251" text-anchor="middle" class="t">tier?</text>
<path d="M300,246 L408,246" class="e" marker-end="url(#a)"/>
<text x="354" y="238" text-anchor="middle" class="l">trivial</text>
<rect x="410" y="216" width="180" height="60" rx="8" class="stop" stroke-width="1.5"/>
<text x="500.0" y="243.0" text-anchor="middle" class="t">Trivial: stop</text>
<text x="500.0" y="261.0" text-anchor="middle" class="s">make the change directly</text>
<path d="M230,286 L230,320" class="e" marker-end="url(#a)"/>
<text x="240" y="307" text-anchor="start" class="l">standard</text>
<rect x="80" y="322" width="300" height="60" rx="8" class="skill" stroke-width="1.5"/>
<text x="230.0" y="349.0" text-anchor="middle" class="t">1. Interview</text>
<text x="230.0" y="367.0" text-anchor="middle" class="s">one question at a time, facts from code</text>
<path d="M230,382 L230,416" class="e" marker-end="url(#a)"/>
<rect x="80" y="418" width="300" height="60" rx="8" class="file" stroke-width="1.5"/>
<text x="230.0" y="445.0" text-anchor="middle" class="t">2. &lt;p&gt;-spec.md</text>
<text x="230.0" y="463.0" text-anchor="middle" class="s">vertical slices, Given/When/Then</text>
<path d="M160,246 L40,246 L40,448 L78,448" class="e" marker-end="url(#a)"/>
<text x="30" y="347" text-anchor="middle" class="l" transform="rotate(-90 30 347)">small: skip interview, one gate</text>
<path d="M230,478 L230,512" class="e" marker-end="url(#a)"/>
<rect x="80" y="514" width="300" height="60" rx="8" class="you" stroke-width="1.5"/>
<text x="230.0" y="541.0" text-anchor="middle" class="t">Gate 1: you approve the spec</text>
<text x="230.0" y="559.0" text-anchor="middle" class="s">edits loop back to the spec</text>
<path d="M380,544 L620,544 L620,50 L648,50" class="e" marker-end="url(#a)"/>
<rect x="650" y="20" width="300" height="60" rx="8" class="skill" stroke-width="1.5"/>
<text x="800.0" y="47.0" text-anchor="middle" class="t">3. /plan-tasks</text>
<text x="800.0" y="65.0" text-anchor="middle" class="s">one task file per slice</text>
<path d="M800,80 L800,114" class="e" marker-end="url(#a)"/>
<rect x="650" y="116" width="300" height="60" rx="8" class="file" stroke-width="1.5"/>
<text x="800.0" y="143.0" text-anchor="middle" class="m">tasks/todo/&lt;p&gt;-task-NN.md</text>
<text x="800.0" y="161.0" text-anchor="middle" class="s">patterns to mirror, validate commands</text>
<path d="M800,176 L800,210" class="e" marker-end="url(#a)"/>
<rect x="650" y="212" width="300" height="60" rx="8" class="you" stroke-width="1.5"/>
<text x="800.0" y="239.0" text-anchor="middle" class="t">4. Gate 2: confirm tasks</text>
<text x="800.0" y="257.0" text-anchor="middle" class="s">executor, review, verify, commit prefix</text>
<path d="M800,272 L800,306" class="e" marker-end="url(#a)"/>
<rect x="650" y="308" width="300" height="60" rx="8" class="skill" stroke-width="1.5"/>
<text x="800.0" y="335.0" text-anchor="middle" class="t">5. /execute-tasks</text>
<text x="800.0" y="353.0" text-anchor="middle" class="s">fresh subagent per task, one commit each</text>
<path d="M800,368 L800,402" class="e" marker-end="url(#a)"/>
<rect x="650" y="404" width="300" height="60" rx="8" class="step" stroke-width="1.5"/>
<text x="800.0" y="431.0" text-anchor="middle" class="t">6. Final report</text>
<text x="800.0" y="449.0" text-anchor="middle" class="s">outcomes, commits, next: PR, /graduate</text>
<rect x="20" y="605" width="14" height="14" rx="3" class="file" stroke-width="1.5"/>
<text x="40" y="616" class="s">file on disk</text>
<rect x="148" y="605" width="14" height="14" rx="3" class="skill" stroke-width="1.5"/>
<text x="168" y="616" class="s">skill / agent</text>
<rect x="283" y="605" width="14" height="14" rx="3" class="you" stroke-width="1.5"/>
<text x="303" y="616" class="s">you</text>
<rect x="348" y="605" width="14" height="14" rx="3" class="stop" stroke-width="1.5"/>
<text x="368" y="616" class="s">stop</text>
<rect x="420" y="605" width="14" height="14" rx="3" class="step" stroke-width="1.5"/>
<text x="440" y="616" class="s">step</text>
</svg>
