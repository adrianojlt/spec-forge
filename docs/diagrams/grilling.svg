<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-label="grilling: one question at a time until a confirmed shared understanding">
<title>grilling: one question at a time until a confirmed shared understanding</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:14px;font-weight:600}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:13px;font-weight:600}
.s{font-size:12px;fill:#59636e}
.l{font-size:12px;font-weight:600;fill:#59636e}
.file{fill:#dafbe1;stroke:#1a7f37}
.skill{fill:#ddf4ff;stroke:#0969da}
.you{fill:#fff8c5;stroke:#9a6700}
.stop{fill:#ffebe9;stroke:#cf222e}
.step{fill:#f6f8fa;stroke:#59636e}
.e{stroke:#59636e;stroke-width:1.5;fill:none}
.d{stroke-dasharray:5 4}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="409" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="20" y="80" width="170" height="64" rx="8" class="step" stroke-width="1.5"/>
<text x="105.0" y="109.0" text-anchor="middle" class="t">Read the idea</text>
<text x="105.0" y="127.0" text-anchor="middle" class="s">look up facts in code</text>
<path d="M190,112 L233,112" class="e" marker-end="url(#a)"/>
<rect x="235" y="80" width="210" height="64" rx="8" class="skill" stroke-width="1.5"/>
<text x="340.0" y="109.0" text-anchor="middle" class="t">Ask one question</text>
<text x="340.0" y="127.0" text-anchor="middle" class="s">recommended answer + confidence</text>
<path d="M445,112 L488,112" class="e" marker-end="url(#a)"/>
<rect x="490" y="80" width="160" height="64" rx="8" class="you" stroke-width="1.5"/>
<text x="570.0" y="109.0" text-anchor="middle" class="t">You answer</text>
<text x="570.0" y="127.0" text-anchor="middle" class="s">decisions are yours</text>
<path d="M650,112 L708,112" class="e" marker-end="url(#a)"/>
<polygon points="710,112 820,60 930,112 820,164" class="step" stroke-width="1.5"/>
<text x="820" y="109" text-anchor="middle" class="t">Can predict your</text>
<text x="820" y="125" text-anchor="middle" class="t">next 3 answers?</text>
<path d="M820,60 L820,34 L340,34 L340,78" class="e" marker-end="url(#a)"/>
<text x="580" y="27" text-anchor="middle" class="l">no: next question</text>
<path d="M820,164 L820,228" class="e" marker-end="url(#a)"/>
<text x="830" y="200" text-anchor="start" class="l">yes</text>
<rect x="700" y="230" width="240" height="74" rx="8" class="skill" stroke-width="1.5"/>
<text x="820.0" y="256.0" text-anchor="middle" class="t">Restate the understanding</text>
<text x="820.0" y="274.0" text-anchor="middle" class="s">outcome, user, why now, success,</text>
<text x="820.0" y="290.0" text-anchor="middle" class="s">constraint, out of scope</text>
<path d="M700,267 L642,267" class="e" marker-end="url(#a)"/>
<rect x="450" y="237" width="190" height="60" rx="8" class="you" stroke-width="1.5"/>
<text x="545.0" y="264.0" text-anchor="middle" class="t">You confirm</text>
<text x="545.0" y="282.0" text-anchor="middle" class="s">explicit yes only</text>
<path d="M545,297 L545,330 L820,330 L820,306" class="e" marker-end="url(#a)"/>
<text x="682" y="348" text-anchor="middle" class="l">no: fold in corrections</text>
<path d="M450,267 L402,267" class="e" marker-end="url(#a)"/>
<text x="426" y="259" text-anchor="middle" class="l">yes</text>
<rect x="200" y="237" width="200" height="60" rx="8" class="file" stroke-width="1.5"/>
<text x="300.0" y="264.0" text-anchor="middle" class="t">summary file</text>
<text x="300.0" y="282.0" text-anchor="middle" class="s">only when o= is given</text>
<path d="M200,267 L162,267" class="e d" marker-end="url(#a)"/>
<rect x="20" y="237" width="140" height="60" rx="8" class="skill" stroke-width="1.5"/>
<text x="90.0" y="264.0" text-anchor="middle" class="m">/orchestrate</text>
<text x="90.0" y="282.0" text-anchor="middle" class="s">i=&lt;summary&gt;</text>
<rect x="20" y="379" width="14" height="14" rx="3" class="file" stroke-width="1.5"/>
<text x="40" y="390" class="s">file on disk</text>
<rect x="148" y="379" width="14" height="14" rx="3" class="skill" stroke-width="1.5"/>
<text x="168" y="390" class="s">skill / agent</text>
<rect x="283" y="379" width="14" height="14" rx="3" class="you" stroke-width="1.5"/>
<text x="303" y="390" class="s">you</text>
<rect x="348" y="379" width="14" height="14" rx="3" class="step" stroke-width="1.5"/>
<text x="368" y="390" class="s">step</text>
</svg>
