<svg xmlns="http://www.w3.org/2000/svg" width="970" height="330" viewBox="0 0 970 330" role="img" aria-label="refine: backlog item to ready item, answered asynchronously">
<title>refine: backlog item to ready item, answered asynchronously</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:14px;font-weight:600}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:13px;font-weight:600}
.s{font-size:12px;fill:#59636e}
.l{font-size:12px;font-weight:600;fill:#59636e}
.file{fill:#dafbe1;stroke:#1a7f37}
.skill{fill:#ddf4ff;stroke:#0969da}
.you{fill:#fff8c5;stroke:#9a6700}
.stop{fill:#ffebe9;stroke:#cf222e}
.step{fill:#f6f8fa;stroke:#59636e}
.e{stroke:#59636e;stroke-width:1.5;fill:none}
.d{stroke-dasharray:5 4}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect x="0.5" y="0.5" width="969" height="329" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="20" y="40" width="190" height="64" rx="8" class="file" stroke-width="1.5"/>
<text x="115.0" y="69.0" text-anchor="middle" class="t">backlog item</text>
<text x="115.0" y="87.0" text-anchor="middle" class="s">status: todo</text>
<text x="115" y="128" text-anchor="middle" class="s">(first run: m=normalize)</text>
<path d="M210,72 L258,72" class="e" marker-end="url(#a)"/>
<rect x="260" y="40" width="200" height="64" rx="8" class="skill" stroke-width="1.5"/>
<text x="360.0" y="69.0" text-anchor="middle" class="t">/refine</text>
<text x="360.0" y="87.0" text-anchor="middle" class="s">explores the code, unattended</text>
<path d="M460,72 L508,72" class="e" marker-end="url(#a)"/>
<rect x="510" y="40" width="250" height="64" rx="8" class="file" stroke-width="1.5"/>
<text x="635.0" y="69.0" text-anchor="middle" class="m">items/&lt;ID&gt;-&lt;slug&gt;.md</text>
<text x="635.0" y="87.0" text-anchor="middle" class="s">findings, tier, verdict, questions</text>
<path d="M760,72 L828,72" class="e" marker-end="url(#a)"/>
<text x="794" y="64" text-anchor="middle" class="l">ready</text>
<rect x="830" y="40" width="120" height="64" rx="8" class="skill" stroke-width="1.5"/>
<text x="890.0" y="69.0" text-anchor="middle" class="m">/orchestrate</text>
<text x="890.0" y="87.0" text-anchor="middle" class="s">i=&lt;item file&gt;</text>
<path d="M635,104 L635,198" class="e" marker-end="url(#a)"/>
<text x="645" y="156" text-anchor="start" class="l">open questions</text>
<rect x="510" y="200" width="250" height="64" rx="8" class="you" stroke-width="1.5"/>
<text x="635.0" y="229.0" text-anchor="middle" class="t">You answer in the item file</text>
<text x="635.0" y="247.0" text-anchor="middle" class="s">Answer: rec / A / B, or ## Notes</text>
<path d="M510,232 L360,232 L360,106" class="e" marker-end="url(#a)"/>
<text x="372" y="222" text-anchor="start" class="l">rerun /refine</text>
<path d="M760,232 L828,232" class="e" marker-end="url(#a)"/>
<text x="794" y="224" text-anchor="middle" class="l">drop: yes</text>
<rect x="830" y="200" width="120" height="64" rx="8" class="stop" stroke-width="1.5"/>
<text x="890.0" y="229.0" text-anchor="middle" class="t">dropped</text>
<text x="890.0" y="247.0" text-anchor="middle" class="s">you confirmed it</text>
<rect x="20" y="295" width="14" height="14" rx="3" class="file" stroke-width="1.5"/>
<text x="40" y="306" class="s">file on disk</text>
<rect x="148" y="295" width="14" height="14" rx="3" class="skill" stroke-width="1.5"/>
<text x="168" y="306" class="s">skill / agent</text>
<rect x="283" y="295" width="14" height="14" rx="3" class="you" stroke-width="1.5"/>
<text x="303" y="306" class="s">you</text>
<rect x="348" y="295" width="14" height="14" rx="3" class="stop" stroke-width="1.5"/>
<text x="368" y="306" class="s">stop</text>
</svg>
