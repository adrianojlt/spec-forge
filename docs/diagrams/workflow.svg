<svg xmlns="http://www.w3.org/2000/svg" width="980" height="670" viewBox="0 0 980 670" role="img" aria-label="spec-forge workflow: from backlog item to committed code">
<title>spec-forge workflow: from backlog item to committed code</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:14px;font-weight:600}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:13px;font-weight:600}
.s{font-size:12px;fill:#59636e}
.l{font-size:12px;font-weight:600;fill:#59636e}
.file{fill:#dafbe1;stroke:#1a7f37}
.skill{fill:#ddf4ff;stroke:#0969da}
.you{fill:#fff8c5;stroke:#9a6700}
.stop{fill:#ffebe9;stroke:#cf222e}
.step{fill:#f6f8fa;stroke:#59636e}
.e{stroke:#59636e;stroke-width:1.5;fill:none}
.d{stroke-dasharray:5 4}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect x="0.5" y="0.5" width="979" height="669" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="270" y="24" width="400" height="56" rx="8" class="file" stroke-width="1.5"/>
<text x="470.0" y="49.0" text-anchor="middle" class="m">backlog/&lt;project&gt;-backlog.md</text>
<text x="470.0" y="67.0" text-anchor="middle" class="s">your ideas and bugs, one heading per item</text>
<rect x="270" y="124" width="400" height="56" rx="8" class="file" stroke-width="1.5"/>
<text x="470.0" y="149.0" text-anchor="middle" class="m">backlog/items/&lt;ID&gt;-&lt;slug&gt;.md</text>
<text x="470.0" y="167.0" text-anchor="middle" class="s">findings, verdict, questions, until ready</text>
<rect x="270" y="244" width="400" height="56" rx="8" class="file" stroke-width="1.5"/>
<text x="470.0" y="269.0" text-anchor="middle" class="m">features/&lt;slug&gt;/&lt;p&gt;-spec.md</text>
<text x="470.0" y="287.0" text-anchor="middle" class="s">approved by you (gate 1)</text>
<rect x="270" y="344" width="400" height="56" rx="8" class="file" stroke-width="1.5"/>
<text x="470.0" y="369.0" text-anchor="middle" class="m">features/&lt;slug&gt;/tasks/todo/&lt;p&gt;-task-NN.md</text>
<text x="470.0" y="387.0" text-anchor="middle" class="s">one task per vertical slice (gate 2)</text>
<rect x="270" y="444" width="400" height="56" rx="8" class="file" stroke-width="1.5"/>
<text x="470.0" y="469.0" text-anchor="middle" class="m">features/&lt;slug&gt;/tasks/done/</text>
<text x="470.0" y="487.0" text-anchor="middle" class="s">code + one commit per task</text>
<rect x="270" y="544" width="400" height="56" rx="8" class="file" stroke-width="1.5"/>
<text x="470.0" y="569.0" text-anchor="middle" class="m">features/&lt;slug&gt;/&lt;p&gt;-decision.md + archive/</text>
<text x="470.0" y="587.0" text-anchor="middle" class="s">after the feature ships</text>
<path d="M470.0,80 L470.0,122" class="e" marker-end="url(#a)"/>
<text x="480.0" y="106.0" text-anchor="start" class="m">/refine</text>
<path d="M470.0,180 L470.0,242" class="e" marker-end="url(#a)"/>
<text x="480.0" y="216.0" text-anchor="start" class="m">/orchestrate</text>
<path d="M470.0,300 L470.0,342" class="e" marker-end="url(#a)"/>
<text x="480.0" y="326.0" text-anchor="start" class="m">/plan-tasks</text>
<path d="M470.0,400 L470.0,442" class="e" marker-end="url(#a)"/>
<text x="480.0" y="426.0" text-anchor="start" class="m">/execute-tasks</text>
<path d="M470.0,500 L470.0,542" class="e" marker-end="url(#a)"/>
<text x="480.0" y="526.0" text-anchor="start" class="m">/graduate</text>
<path d="M670,140 C720,140 720,164 672,164" class="e" marker-end="url(#a)"/>
<text x="724" y="148" text-anchor="start" class="s">you answer in the item file,</text>
<text x="724" y="164" text-anchor="start" class="s">then rerun /refine</text>
<path d="M680,244 L690,244 L690,500 L680,500" class="e"/>
<text x="702" y="362" text-anchor="start" class="m">/orchestrate</text>
<text x="702" y="380" text-anchor="start" class="s">drives spec, tasks</text>
<text x="702" y="396" text-anchor="start" class="s">and execution</text>
<rect x="20" y="124" width="220" height="56" rx="8" class="skill" stroke-width="1.5"/>
<text x="130.0" y="149.0" text-anchor="middle" class="t">/grilling summary</text>
<text x="130.0" y="167.0" text-anchor="middle" class="s">or any idea or draft</text>
<path d="M130,180 L130,212 L468.0,212" class="e d" marker-end="url(#a)"/>
<rect x="20" y="300" width="220" height="250" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="130" y="326" text-anchor="middle" class="t">Other project folders</text>
<text x="36" y="362" text-anchor="start" class="m">overview/</text>
<text x="36" y="379" text-anchor="start" class="s">principles, context, html</text>
<text x="36" y="410" text-anchor="start" class="m">assets/</text>
<text x="36" y="427" text-anchor="start" class="s">images, code, configs</text>
<text x="36" y="458" text-anchor="start" class="m">prompts/</text>
<text x="36" y="475" text-anchor="start" class="s">reusable prompts</text>
<text x="36" y="506" text-anchor="start" class="m">tasks/</text>
<text x="36" y="523" text-anchor="start" class="s">standalone tasks</text>
<rect x="20" y="629" width="14" height="14" rx="3" class="file" stroke-width="1.5"/>
<text x="40" y="640" class="s">file on disk</text>
<rect x="148" y="629" width="14" height="14" rx="3" class="skill" stroke-width="1.5"/>
<text x="168" y="640" class="s">skill / agent</text>
</svg>
